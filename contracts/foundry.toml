[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.37"
evm_version = "osaka"          # Monad supports all opcodes/precompiles as of Osaka
optimizer = true
optimizer_runs = 200
via_ir = true
network = "monad"              # Foundry >= 1.8: Monad gas model (MIP-8 storage pages), 128 KB code limit

# what @openzeppelin/upgrades-core needs to validate out/build-info (`npm run validate`)
ast = true
build_info = true
extra_output = ["storageLayout"]

# verification settings from the official foundry-monad template
bytecode_hash = "none"
use_literal_content = true

fs_permissions = [
  { access = "read", path = "../tests/vectors" },
  { access = "read", path = "./test/fixtures" },
  { access = "read", path = "./out" },
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "../deployment" },
]

[invariant]
runs = 256
depth = 200
fail_on_revert = true

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
local = "http://127.0.0.1:8545"

[lint]
lint_on_build = false
